http {
    default_type                text/plain;
    default_cgi_type            text/html;
    keepalive_timeout           20;
    client_header_timeout       10;
    client_body_timeout         5;
    cgi_timeout                 5;
    client_max_body_size        500;

    server {
        listen                  127.0.0.1:8017;
        server_name             server1;
        root                    files/www/website;
        sendfile                on files/home/uploads;

        add_header               X-Server-Info "server1";
        add_header               X-Root "files/www/website";

        location /uploads {
            client_max_body_size        500M;
            alias                       files/home/uploads;
            autoindex                   on;
        }

        location /method_not_allowed {
            alias                   files/www/website;
            autoindex               on;
            allowed_methods         GET;
        }

        location /mini-upload/ {
            client_max_body_size        50K;
            alias                       files/home/uploads;
            autoindex                   on;
            allowed_methods        POST GET;
        }

        location /team/ {
            alias files/www/team/;
            index github.html;
        }
    }

    server {
        listen                  127.0.0.1:8017;
        server_name             returnServer;
        root                    files/www/website;
        sendfile                off;
        autoindex               on;

        add_header               X-Server-Info "server2; server2bis";
        add_header               X-Root "files/www/website";

        location /herisson1 {
            return 301 "https://fr.wikipedia.org/wiki/H%C3%A9risson";
        }

        location /herisson {
            return 200 "Hello, I am the herisson location in returnServer";
        }

        location /herisson3 {
            return 200 "FAKE HERISSON LOCATION";
        }

        location /herisson3 {
            return 301 /herisson;
        }

        location /teapot {
            return 418 "I'm a teapot";
        }

        location /private {
            return 403;
        }
        location /deprecated {
            return 410;
        }
        location /team/ {
            alias files/www/team/;
            index github.html;
        }
    }

    server {
        listen                  127.0.0.1:8018;
        server_name             madmax;
        root                    files/www/website;
        auth_loc                /auth;

        add_header               X-Server-Info "madmax";

        location /cgi-bin/ {
            autoindex         on;
            alias            files/usr/bin/;
            cgi_pass        .py /usr/bin/python3;
            cgi_pass        .sh /usr/bin/bash;
            cgi_pass        .py /usr/bin/python3;
            cgi_pass        .php /usr/bin/php;
        }

        location /cgi-bin/guestbook {
            cgi_pass        .c  files/usr/bin/guestbook/guestbook.cgi;
        }
        location /cgi-bin/sysstats {
            cgi_pass        .c  files/usr/bin/sysstats/sysstats.cgi;
        }
        location /cgi-bin/mdrender {
            cgi_pass        .c  files/usr/bin/mdrender/mdrender.cgi;
        }

        location /cgi-bin/rot13 {
            cgi_pass        .out  files/usr/bin/rot13/rot13.out;
        }


        location /team/ {
            alias files/www/team/;
            index github.html;
        }
    }


    server {
        listen 127.0.0.1:8019;
        server_name brasserie;

        error_page 404 files/www/brasserie/404.html;

        root files/www/brasserie;
        index index.html;

        location /contact/ {
            alias files/www/brasserie;
            index contact.html;
        }

        location /booking/ {
            alias files/www/brasserie;
            index booking.html;
        }
    }
}