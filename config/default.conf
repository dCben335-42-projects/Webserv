http {
    autoindex on;
    server {
        listen google.com:8080;
        server_name example.com;
    }
    server {
        listen 127.0.0.1:8080;
        server_name example.com;
    }
    server {
        listen localhost:8080;
        server_name example1.com;
        root /var/www/enculer;
    }
     server {
        listen localhost:8080;
    }
     server {
        listen localhost:8080;
        server_name exasawd.com;
        root /var/www/html;
        auth_loc    /secret/;
        location / {
            index index.html;
        }
        location /images/ {
            root /var/www/images;
        }
    }
     server {
        listen localhost:8080;
        server_name example.com;
        root /var/www/website;
    }
    server {
        listen 0.0.0.0:8080;
        server_name example.com;
        root /var/www/988;
    }
    server {
        listen 127.0.0.1:8090;
        server_name example.com;
        root /var/www/asdawdadawd;
        alias /var/www/FFFFFFFFFFFFFFFFFFFFFFFDDDDDDDDDDDDDDDDDDDDDDDDPPPPPPPPPPPPPPPPPPPPPPPPP;
        location / {
            index index.html index.htm index.php;
            alias /var/www/988;
        }
    }
}