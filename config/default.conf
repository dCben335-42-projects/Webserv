http {
    default_type                text/plain;
    default_cgi_type            text/plain;
    keepalive_timeout           10;
    client_header_timeout       10;
    client_body_timeout         20;
    cgi_timeout                 5;
    client_max_body_size        500M;

    autoindex           on;

    sendfile            on /var/www/uploads;

    error_page          500 /var/www/errors/500.html;
    error_page          404 /var/www/errors/404.html;
    error_page          403 files/www/errors/403.html;
    error_page          413 /var/www/errors/413.html;

    server {
        listen            localhost:8017;
        server_name       i_am_the_one_who_ports;
        root                    files/www/website;
        index                   index.html index.htm;
        sendfile                on files/www/uploads;
        auth_loc                 /auth;
        add_header               X-Cache-Info "not cacheable; meta data too large";

        index               index.html index.htm;
        add_header          X-Cache-Info "not cacheable; meta data too large";
        root                files/www/website;


        location /test {
            root   html;
            index  index.html index.htm index2.html shrek.html benoit.html;
        }

        location /test {
            root   asdawdawd;
        }

        location /uploads {
            alias         files/www/uploads;
            autoindex     on;
        }

        location /bonjour {
            return 200 "bonjour";
            allowed_methods GET POST;
        }

        location /redirect {
            return 301 /bonjour;
        }

        location /usr/bin/ {
            alias files/www/usr/bin/;
            cgi_pass        .py /usr/bin/python3;
            cgi_pass        .php /usr/bin/php;
            cgi_pass        .out files/www/usr/bin/binary.out;
        }


        location /cgi-bin/ {
            autoindex         on;
            alias            files/www/usr/bin/;
            cgi_pass        .py /usr/bin/python3;
            cgi_pass        .php /usr/bin/php;
            cgi_pass        .sh /usr/bin/bash;
        }

        location /cgi-bin/guestbook {
            cgi_pass        .c  files/www/usr/bin/guestbook/guestbook.cgi;
        }
        location /cgi-bin/sysstats {
            cgi_pass        .c  files/www/usr/bin/sysstats/sysstats.cgi;
        }
        location /cgi-bin/mdrender {
            cgi_pass        .c  files/www/usr/bin/mdrender/mdrender.cgi;
        }
    }
    server {
        listen            127.0.0.1:8018;
        server_name        second_server;
        root             /var/www/website/;
        index            index.html "opdw/index.htm";
        location /health {
            return 200 "Server is running\n";
        }
        location /old-page {
            return 301 /new-page;
        }
        location /temp {
            return 302 /temporary-page;
        }
        location /private {
            return 403;
        }
        location /deprecated {
            return 410;
        }
        location /maintenance {
            return 503 "Service temporarily unavailable\n";
        }
    }
}