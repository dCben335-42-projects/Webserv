http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        auth_loc /auth;
        listen       80;
        server_name  localhost;

        root   /www/nginx_test;
            index  index.html index.htm;
        location / {
        }
        location /test {
            root   html;
            index  index.html index.htm;
        }

        location /usr {

        }

        location /usr/ {

        }

        location /usr/bin {
            auth_required on;    
        }

        error_page 500 502 503 504;
        location = /usr/bin/test.py {
            cgi_pass .py /usr/bin/python3
            cgi_pass .php /usr/bin/php-cgi
        }

          location = /usr/bin/test.py/test
          {
            cgi_pass .py /usr/bin/python3
            cgi_pass .php /usr/bin/php-cgi
          } 
    }
}

