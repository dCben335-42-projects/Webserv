http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        root   /www/nginx_test;
        location / {
            index  index.html index.htm;
        }
        location /test {
            root   html;
            index  index.html index.htm;
        }

        error_page 500 502 503 504;
        location = /50x.html {
            root   html;
            error_page 404 /404.html;
        }
    }
}