<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>ROT13 CGI Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            width: 500px;
            max-width: 90%;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2a5298;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        * {
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            resize: vertical;
            transition: border 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.2);
        }

        .btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2a5298;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background: #1e3c72;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>ROT13 – Test the CGI</h1>
        <form action="/usr/bin/binary.out" method="POST">
            <label for="text">Text to transform :</label>
            <textarea id="text" name="text" rows="5" placeholder="Write your text here..."></textarea>
            <input type="submit" value="Transform" class="btn">
        </form>
    </div>
</body>


</html>
